spring.profiles.active=dev
server.port=9999
spring.application.name=Realiza Contacoes Seguro
################Banco de dados##########################
spring.datasource.url=jdbc:mysql://localhost:3306/cotacao?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

##################API Externa###########################
feign.consulta.oferta.url=http://localhost:9091/servicos-externos
feign.consulta.produto.url=http://localhost:9091/servicos-externos

################KAFKA###################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.properties.specific.avro.reader=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.topic=cotacao-topic

spring.kafka.consumer.group-id=acme
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.topic=cotacao-topic
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.session-timeout-ms=45000
spring.kafka.consumer.heartbeat-interval-ms=15000


##################LOG############################
logging.level.org.springframework.boot.autoconfigure=ERROR
management.endpoints.web.exposure.include=*
management.endpoint.mappings.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html