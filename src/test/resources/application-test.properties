spring.profiles.active=dev
server.port=9090
spring.application.name=Realiza Contacoes Seguro
################Banco de dados##########################
spring.datasource.url=jdbc:mysql://mysql:3306/cotacao?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
##################API Externa###########################
feign.consulta.oferta.url=localhost:9091/servicos-externos
feign.consulta.produto.url=localhost:9091/servicos-externos
################KAFKA###################################
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.topic=topic-external
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=acme
##################LOG############################
logging.level.org.springframework.boot.autoconfigure=ERROR
management.endpoints.web.exposure.include=*
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

