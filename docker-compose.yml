version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cotacao
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./init_sql:/docker-entrypoint-initdb.d/
      - mysql-data:/var/lib/mysql
    networks:
      - minha-rede

  servicos-externos:
    image: python:3.9
    container_name: servicos-externos
    volumes:
      - ./mock_services:/app
    working_dir: /app
    ports:
      - "9091:9091"
    command: [ "python", "mock_api.py" ]
    networks:
      - minha-rede

  kafka:
    container_name: kafka
    image: obsidiandynamics/kafka
    restart: "no"
    ports:
      - "2181:2181"
      - "9092:9092"
    networks:
      - minha-rede
    environment:
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT: "6000"
      KAFKA_RESTART_ATTEMPTS: "10"
      KAFKA_RESTART_DELAY: "5"
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: "0"
      KSQL_CONFIG_FILE: "/etc/kafka/ksql-config.sql"
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data
      - ./ksql-config.sql:/etc/kafka/ksql-config.sql

  ksql-server:
    image: confluentinc/cp-ksqldb-server:latest
    container_name: ksql-server
    restart: always
    depends_on:
      - kafka
    ports:
      - "8088:8088"
    networks:
      - minha-rede
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "kafka:29092"
      KSQL_KSQL_SERVICE_ID: "ksql-cluster"
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: "earliest"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
    volumes:
      - ./ksql-config.sql:/docker-entrypoint-initdb.d/ksql-config.sql
networks:
  minha-rede:
    driver: bridge

volumes:
  mysql-data:
  kafka-data:
